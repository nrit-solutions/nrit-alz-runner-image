# GitHub stops handing jobs to a runner about 30 days after a newer runner
# release, and the pinned runner then hangs instead of failing (#19). This opens
# an issue while there is still time to bump GH_RUNNER_VERSION and release.
name: runner-version

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pinned runner with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pinned="$(sed -n 's/^ARG GH_RUNNER_VERSION=//p' Dockerfile)"
          read -r latest published < <(gh api repos/actions/runner/releases/latest --jq '"\(.tag_name|ltrimstr("v")) \(.published_at[0:10])"')
          echo "pinned ${pinned}, latest ${latest} (published ${published})"
          [ "$pinned" = "$latest" ] && exit 0
          title="Bump the GitHub Actions runner to ${latest}"
          if [ -n "$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[].number')" ]; then
            echo "an open issue already tracks ${latest}"
            exit 0
          fi
          deadline="$(date -u -d "${published} + 30 days" +%F)"
          gh issue create --title "$title" --body "The image pins runner ${pinned}. Runner ${latest} was published on ${published}, and GitHub stops handing jobs to older runners about 30 days later, around ${deadline}. A stale runner hangs instead of failing, which stops every self-hosted job and costs money for each hung execution (#19).

          Bump \`GH_RUNNER_VERSION\` in the \`Dockerfile\`, release the image, and pin the new digest in the bootstrap before ${deadline}."
