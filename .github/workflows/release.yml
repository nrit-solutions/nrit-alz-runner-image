# Tag vX.Y.Z to release. The run builds the image, fails on CRITICAL
# vulnerabilities, pushes X.Y.Z and latest to GHCR, signs the digest with
# cosign (keyless, GitHub OIDC), and attaches an SPDX SBOM attestation.
# The digest printed by the push step is the value consumers pin.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release carrying the SBOM
  packages: write
  id-token: write # cosign keyless signing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/alz-runner

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: local/alz-runner:scan

      # The image is over 3 GB and trivy exports it to the runner's root disk,
      # which the preinstalled toolchains leave too full for the export.
      - name: Free disk space for the scan
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/alz-runner:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # A plain manifest, not an OCI index: the pushed digest is the image
          # digest consumers pin and az acr import copies verbatim.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # The full SBOM is over 16 MB, which both the public Rekor log and
      # GitHub attestations reject as a payload. sign-blob puts only the hash
      # in the transparency log, so the SBOM ships as a signed release asset.
      - name: Sign the SBOM
        run: cosign sign-blob --yes --bundle sbom.spdx.json.bundle sbom.spdx.json

      - name: Create the release with the SBOM attached
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "${IMAGE}@${DIGEST} is the pin. See CHANGELOG.md for the changes." \
            sbom.spdx.json sbom.spdx.json.bundle
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Print the pin
        run: echo "Release ${GITHUB_REF_NAME} pushed as ${IMAGE}@${{ steps.push.outputs.digest }}"
