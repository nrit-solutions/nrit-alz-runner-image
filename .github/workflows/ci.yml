# Pull requests build the image, run the same CRITICAL-severity scan as the
# release workflow (so a green PR cannot fail the release scan), and smoke
# the gate tools inside the built image. Nothing is pushed.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: local/alz-runner:pr

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/alz-runner:pr
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke the gate tools
        run: |
          docker run --rm --entrypoint "" local/alz-runner:pr bash -ec '
            conftest --version
            checkov --version
            az version --output none
            git --version
            jq --version
          '

      # Jobs run as the runner user and must not reach the secrets the
      # root-owned entrypoint holds (nrit-alz-runner-image#6). PID 1 in this
      # container stands in for dumb-init.
      - name: Job user cannot read the entrypoint environment
        run: |
          docker run --rm --entrypoint "" -e PROBE_MARKER=present local/alz-runner:pr bash -ec '
            if command -v sudo >/dev/null; then echo "sudo is installed"; exit 1; fi
            test "$(gosu runner id -u)" = 1001
            if gosu runner cat /proc/1/environ >/dev/null 2>&1; then echo "runner can read /proc/1/environ"; exit 1; fi
            test "$(gosu runner cat /proc/self/environ | tr "\0" "\n" | grep -c "^PROBE_MARKER=")" = 1
          '
