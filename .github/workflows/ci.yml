# Pull requests build the image, run the same CRITICAL-severity scan as the
# release workflow (so a green PR cannot fail the release scan), and smoke
# the gate tools inside the built image. Nothing is pushed.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: local/alz-runner:pr

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/alz-runner:pr
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke the gate tools
        run: |
          docker run --rm --entrypoint "" local/alz-runner:pr bash -ec '
            conftest --version
            checkov --version
            az version --output none
            git --version
            jq --version
          '
