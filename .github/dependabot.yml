version: 2

# Actions are pinned to a commit SHA with the version in a trailing comment.
# Dependabot follows that convention: it bumps the SHA and rewrites the
# comment, so pinning does not mean going stale.
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
